name: $(Project)_$(BuildDefinitionName)_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)
variables:
  - name: AndroidChkBuilds
    value: ""
  - name: system.debug
    value: false
  - name: BuildAuthenticationAADSecret
    value: null
resources:
  repositories:
    - repository: Pipelines
      type: git
      name: PipelineTemplates/PipelineTemplates
      ref: refs/head/main
trigger:
  branches:
    include:
      - master
      - main
extends:
  template: v1/Official.PipelineTemplate.yml@Pipelines
  parameters:
    sdl:
      git:
        submodules: recursive
    pool:
      os: windows
      image: windows-11
      name: Azure-Pipelines-PT-ExDShared
    customBuildTags:
      - MigrationTooling-microsoft-account-36972-Tool
            displayName: Build and Release Msix
            cancelTimeoutInMinutes: 1
            templateContext:
              outputs:
                - output: pipelineArtifact
                  artifactName: drop
                  targetPath: $(Build.ArtifactStagingDirectory)
                  displayName: "Publish Artifact: drop"
            steps:
              - checkout: self
                clean: true
                submodules: recursive
                lfs: true
                fetchTags: false
                persistCredentials: true
              - template: /pipelines/templates/task-microsoft-Appx-release-msix-converted.yml@self
                parameters:
                  MSBuildArgs: /user:andreanadr msixmgr
                  MSBuildArgs2: /user:GetMsixProducts;MsixMgrWix /p:RunWixToolsOutOfProc=true /p:PostBuildEventUseInBuild=false
                  TDBuildAuthenticationAADSecret: $(BuildAuthenticationAADSecret)
          - job: Job
            displayName: Run Tests
            dependsOn: Phase_15
            templateContext:
              outputs:
                - output: pipelineArtifact
                  artifactName: droplogs
                  targetPath: $(Build.ArtifactStagingDirectory)
                  displayName: "Publish Artifact: droplogs"
                  condition: succeededOrFailed()
            steps:
              - checkout: self
                clean: true
                submodules: recursive
                lfs: true
                fetchTags: false
              - task: DownloadBuildArtifacts@0
                displayName: Download Build Artifacts
                inputs:
                  downloadType: specific
                  downloadPath: $(Pipeline.home)
                  extractTars: true
              - task: PowerShell
                displayName: Find and install msixSetup
                inputs:
                  targetType: inline
                  script: |
                    # Write your PowerShell commands here.

                    $installtarget = dir -recurse $env:ArtifactDirectory\msixSetup-*-arm64.msi

                    $installtarget

                    start-process -wait -filepath msiexec -argumentlist /I, $installtarget.fullname, /qn

                    git  fetch
                    git  pull
                env:
                  MY_ACCESS_TOKEN: $(System.AccessToken)
                  ArtifactDirectory: $(Pipeline.Workspace)
              - task: PowerShell
                displayName: Run msix tests
                inputs:
                  filePath: Msix/test.ps1
                  arguments: -binary $env:ProgramFiles\msix-trace $true
                  errorActionPreference: continue
                  workingDirectory: Msix/Tests
                continueOnError: true
              - task: PowerShell
                displayName: Debugging on agent machine commands
                condition: succeededOrFailed()
                inputs:
                  targetType: inline
                  script: |
                    write-host "environment-variables"
                    #dir env:

                    #write-host "msix directory"
                    #dir $env:ProgramFiles\msixmgr

                    #write-host "current directory"
                    #convert-path .
                    cd msix\tests
                    convert-path .

                    $executable = join-path $env:ProgramFiles "msix\msix.exe"

                    & .\msixtrace.ps1 -start

                    write-host "all packages"
                    & $executable -FindPackage *

                    write-host "fake does not exist package"
                    & $executable  -FindPackage com.android.microsoft_1.0.0.1_arm64_8wekyb3d8bbwe

                    write-host "add notepad"
                    & $executable  -AddPackage notepadplus.msix -Ux3402za


                    write-host "remove notepad"
                    & $executable  -RemovePackage notepadplus_0.0.0.0_arm64_8wekyb3d8bbwe
                    & .\msixtrace.ps1 -stop
                  errorActionPreference: silentlyContinue
                  ignoreLASTEXITCODE: true
                env:
                  MY_ACCESS_TOKEN: $(System.AccessToken)
                continueOnError: true
              - task: CopyFiles@2
                displayName: "Copy Files to: $(Build.UserDirectory)"
                condition: succeededOrFailed()
                inputs:
                  SourceFolder: Msix/Tests
                  Contents: msixtrace*.log
                  TargetFolder: $(build.userDirectory)
